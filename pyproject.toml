[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privatevault-cbrain"
version = "0.1.0a0"
description = "Governed execution runtime for production AI agents"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cbrain-hermes = "cbrain.hermes_launcher:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3,<10",
  "pytest-cov>=6",
  "ruff>=0.11"
]
frameworks = [
    "autogen-agentchat>=0.7.5",
    "autogen-core>=0.7.5",
    "autogen-ext[openai]>=0.7.5",
    "crewai>=1.15.9",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
]
privatevault = [
    "privatevault-agent-dna",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cbrain*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.uv.sources]
privatevault-agent-dna = { path = "../privatevault-agent-dna", editable = true }
