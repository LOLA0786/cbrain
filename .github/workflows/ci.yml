name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cbrain

    steps:
      - name: Check out CBrain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: cbrain
          persist-credentials: false

      - name: Check out pinned PrivateVault Agent DNA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LOLA0786/privatevault-agent-dna
          ref: 65673769d4c7cd2de980f5f5c335ac09141b7434
          path: privatevault-agent-dna
          ssh-key: ${{ secrets.PRIVATEVAULT_REPO_SSH_KEY }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.9"
          enable-cache: true
          working-directory: cbrain
          cache-dependency-glob: uv.lock

      - name: Install locked development, PrivateVault, and knowledge dependencies
        run: uv sync --locked --extra dev --extra privatevault --extra knowledge

      - name: Verify PrivateVault conformance dependencies
        run: |
          uv run python - <<'PY'
          import nacl.signing
          import agent_dna.authority_v01
          import agent_dna.execution_v01
          import agent_dna.dispatch_v01
          import agent_dna.closure_v01
          print("PrivateVault conformance dependencies: OK")
          PY

      - name: Ruff format
        run: uv run ruff format --check cbrain integrations tests

      - name: Ruff lint
        run: uv run ruff check cbrain integrations tests

      - name: Mypy
        run: uv run mypy cbrain

      - name: Mandatory execution-gateway conformance
        run: uv run python -m pytest -q tests/test_execution_gateway_conformance.py

      - name: Adversary escape suite
        run: uv run python -m pytest -q tests/adversary/

      - name: Full test suite
        run: uv run python -m pytest -q

      - name: Compile Python sources
        run: uv run python -m compileall -q cbrain tests

      - name: Verify dependency lock
        run: uv lock --check

      - name: Check whitespace errors
        run: git diff --check

  knowledge-live:
    name: knowledge-live
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: cbrain

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: cbrain
          POSTGRES_PASSWORD: cbrain_ci
          POSTGRES_DB: cbrain_knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cbrain -d cbrain_knowledge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CBRAIN_KNOWLEDGE_LIVE: "1"
      CBRAIN_KNOWLEDGE_PG_DSN: postgresql://cbrain:cbrain_ci@localhost:5432/cbrain_knowledge
      CBRAIN_KNOWLEDGE_REDIS_DSN: redis://localhost:6379/0
      CBRAIN_KNOWLEDGE_MODE: production

    steps:
      - name: Check out CBrain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: cbrain
          persist-credentials: false

      - name: Check out pinned PrivateVault Agent DNA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LOLA0786/privatevault-agent-dna
          ref: 65673769d4c7cd2de980f5f5c335ac09141b7434
          path: privatevault-agent-dna
          ssh-key: ${{ secrets.PRIVATEVAULT_REPO_SSH_KEY }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.9"
          enable-cache: true
          working-directory: cbrain
          cache-dependency-glob: uv.lock

      - name: Install locked knowledge dependencies
        run: uv sync --locked --extra dev --extra privatevault --extra knowledge

      - name: Apply knowledge migrations
        run: |
          uv run python - <<'PY'
          import os
          from cbrain.knowledge.stores.postgres import (
              PostgresKnowledgeStore,
              apply_knowledge_migrations,
          )
          dsn = os.environ["CBRAIN_KNOWLEDGE_PG_DSN"]
          apply_knowledge_migrations(dsn, timeout_seconds=5.0)
          store = PostgresKnowledgeStore(dsn, timeout_seconds=5.0)
          store.ping()
          store.require_pgvector()
          store.require_schema()
          print("knowledge migrations applied")
          PY

      - name: Live knowledge integration suite
        run: |
          set -euo pipefail
          uv run python -m pytest -q tests/test_knowledge_runtime_integration.py | tee /tmp/knowledge-live.txt
          if grep -Eq '[1-9][0-9]* skipped' /tmp/knowledge-live.txt; then
            echo "live knowledge tests skipped unexpectedly"
            exit 1
          fi

  isolation:
    name: isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cbrain

    steps:
      - name: Check out CBrain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: cbrain
          persist-credentials: false

      - name: Prove worker cannot reach write; sidecar can
        working-directory: cbrain/deploy/isolation
        run: |
          set -euo pipefail
          chmod +x probe.sh
          docker compose -f compose.yml up --abort-on-container-exit --exit-code-from worker
          docker compose -f compose.yml logs worker | tee /tmp/isolation-worker.log
          grep -q PROBE_PASSED /tmp/isolation-worker.log

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.9"
          enable-cache: true
          working-directory: cbrain
          cache-dependency-glob: uv.lock

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Isolation pytest gate
        env:
          CBRAIN_ISOLATION: "1"
          CBRAIN_ISOLATION_PROBE: passed
        run: |
          uv run python -m pytest -q \
            tests/test_isolation_boundary.py \
            tests/adversary/test_escape_suite.py \
            tests/test_claim_matrix.py
